name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least privilege: nothing in this workflow needs write access. The `package`
# job builds and installs the .deb on a throwaway runner and uploads nothing
# (spec el-12jf6c, "No uploads to third-party services").
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 8.15.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      - name: Test packages/core
        run: bun test src
        working-directory: packages/core

      - name: Test packages/storage
        run: bun test src
        working-directory: packages/storage

      - name: Test packages/quarry
        run: bun test src
        working-directory: packages/quarry

      - name: Test packages/smithy
        run: bun test src
        working-directory: packages/smithy

      - name: Test Changesets release preparation and guards
        run: bun test scripts/release.test.ts

      # Release helpers (scripts/motuslab-version.sh, scripts/motuslab-release-notes.sh)
      # ship their own unit tests; run them here so tag parsing and changelog
      # extraction cannot regress between releases.
      - name: Self-test the MotusLab release helper scripts
        run: |
          scripts/motuslab-version.sh --self-test
          scripts/motuslab-release-notes.sh --self-test

  # Continuous packaging check (spec el-12jf6c, "Continuous packaging check";
  # design D7): build the .deb and prove it installs and runs on Ubuntu on
  # every PR and push to master, so packaging breakage shows up before a
  # release. Nothing is uploaded — the .deb is discarded with the runner.
  package:
    needs: ci
    runs-on: ubuntu-22.04 # D3: oldest supported target; explicit runner version

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 8.15.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      # build-deb.sh drives `pnpm build` itself but does not install first.
      - run: pnpm install --frozen-lockfile

      - name: Refuse third-party upload steps in workflows
        run: scripts/check-no-third-party-publish.sh

      # 0.0.0+ci<N> is a throwaway version that can never be mistaken for a
      # release: 0.0.0 sorts below every real x.y.z, and +ci<N> below every
      # +motuslab<n> of the same x.y.z (dpkg --compare-versions agrees).
      - name: Build the .deb (CI build, not a release)
        run: scripts/build-deb.sh "0.0.0+ci${{ github.run_number }}" dist-deb

      # The deb carries the throwaway 0.0.0+ci<N> Version, but the binary
      # inside reports the real app version (packages/quarry/package.json,
      # which is what `sf --version` prints) — pass it via --expect-version
      # instead of letting the smoke test derive 0.0.0 from the deb Version.
      - name: Smoke-test the .deb (install, run, purge)
        run: |
          app_version="$(node -p "require('./packages/quarry/package.json').version")"
          sudo scripts/smoke-test-deb.sh dist-deb/*.deb --expect-version "$app_version"
